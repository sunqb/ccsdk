services:
  cc-agent-sdk:
    build: .
    container_name: cc-agent-sdk
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      - AGENT_SDK_FIRST_OUTPUT_TIMEOUT_MS=${AGENT_SDK_FIRST_OUTPUT_TIMEOUT_MS:-30000}
      - AGENT_SDK_PERMISSIONS_ALLOW=${AGENT_SDK_PERMISSIONS_ALLOW:-}
      - WORK_DIR=/workspace
      - SKILLS_DIR=/app/skills
      - SANDBOX_ENABLED=${SANDBOX_ENABLED:-false}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-ccsdk-sandbox:latest}
      - SANDBOX_NETWORK=${SANDBOX_NETWORK:-bridge}
      - SANDBOX_MEMORY=${SANDBOX_MEMORY:-2g}
      - SANDBOX_CPUS=${SANDBOX_CPUS:-1.0}
      - SANDBOX_PIDS_LIMIT=${SANDBOX_PIDS_LIMIT:-256}
      - SANDBOX_TIMEOUT_SECONDS=${SANDBOX_TIMEOUT_SECONDS:-900}
    volumes:
      - ./workspace:/workspace
      - ./.claude/skills:/app/skills:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
